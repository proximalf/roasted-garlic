[project]
name = "pennyio"
version = "0.3.3"
description = "Common image functions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "opencv-python>=4.12.0.88",
    "rawpy>=0.25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
honor_noqa = true
color_output = true

[dependency-groups]
dev = [
    "black>=25.9.0",
    "isort>=6.1.0",
]

[project.optional-dependencies]
selection = [
    "rasterio>=1.5.1",
    "shapely>=2.1.2",
]
